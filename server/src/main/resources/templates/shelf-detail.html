<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${shelf.name} + ' - Home Library'">Shelf - Home Library</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">
<div class="container py-4">

    <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom">
        <h1 class="h3 fw-bold text-primary mb-0" th:text="${shelf.name}">Shelf Name</h1>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Back</a>
    </header>

    <!-- Shelf Photo -->
    <div th:if="${shelf.photo != null}" class="mb-4" style="max-width:800px; margin:0 auto;">
        <img th:src="@{/shelves/{id}/photo(id=${shelf.id})}" th:alt="${shelf.name}" class="shelf-photo">
    </div>

    <!-- Books on this shelf -->
    <div>
        <h2 class="h5 fw-semibold mb-3">
            Books on this Shelf
            <span class="badge bg-primary rounded-pill ms-1" th:text="${shelf.books.size()}">0</span>
        </h2>

        <div th:if="${shelf.books.empty}" class="text-center py-5 bg-white rounded-3 border">
            <p class="text-muted fs-5 mb-0">No books on this shelf yet</p>
        </div>

        <div th:if="${!shelf.books.empty}" class="books-grid">
            <div th:each="book : ${shelf.books}" class="book-card">
                <a th:href="@{/books/{id}(id=${book.id})}" class="book-link">
                    <div class="book-cover">
                        <div th:if="${!book.images.empty}" class="thumbnail">
                            <img th:src="@{/images/{bookId}/cover(bookId=${book.id})}"
                                 th:alt="${book.title}">
                        </div>
                        <div th:if="${book.images.empty}" class="placeholder"><span>📖</span></div>
                    </div>
                    <div class="book-info">
                        <div class="book-title" th:text="${book.title ?: 'Untitled'}">Book Title</div>
                        <div class="book-authors" th:if="${!book.authors.empty}"
                             th:text="${#strings.listJoin(book.authors.![name], ', ')}">Authors</div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted py-4 mt-4 border-top small">
        Bookworm - Home Library System
    </footer>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
