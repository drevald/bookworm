spring.application.name=bookworm-server
server.port=8080
grpc.server.port=9090
grpc.server.max-inbound-message-size=33554432
grpc.server.max-inbound-metadata-size=8388608

# Database Configuration
# Uses environment variables from .env file (local) or docker-compose.yml (container)
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:bookworm}
spring.datasource.username=${DB_USERNAME:bookworm}
spring.datasource.password=${DB_PASSWORD:bookworm}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Python OCR + Metadata Service (uses proven ocr.py logic)
ocr.service.url=${OCR_SERVICE_URL:http://localhost:5000}

# ISBN Lookup Providers (tried in priority order: РГБ → НЭБ → Google Books → Open Library)
# 1. РГБ — Russian State Library / Lenin Library (rsl.ru), free, largest Russian library
isbn.providers.rsl.base-url=${RSL_BASE_URL:https://search.rsl.ru}
# 2. НЭБ — National Electronic Library of Russia (free, strong digital Russian collection)
# IDN punycode for нэб.рф. Override if their API URL changes.
isbn.providers.neb.base-url=${NEB_BASE_URL:https://xn--c1abs.xn--p1ai}
# 3. Google Books API (free without key ~1000 req/day; set env var for higher quota)
isbn.providers.google.api-key=${GOOGLE_BOOKS_API_KEY:}
# 4. Open Library — always free, no key needed, last resort
